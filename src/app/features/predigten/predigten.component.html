<!-- Loading state -->
<app-loading-state *ngIf="isLoading"></app-loading-state>

<!-- Error state -->
<app-error-state
  *ngIf="hasError && !isLoading"
  [errorMessage]="errorMessage"
  (retry)="loadData()"
>
</app-error-state>

<!-- Main content -->
<div *ngIf="pageData && !isLoading && !hasError">
  <!-- Dynamic Layout Components -->
  <app-dynamic-layout
    *ngIf="hasLayoutComponents()"
    [components]="getLayoutComponents()"
    [pageTitle]="pageData.title"
    cssClass=""
  >
  </app-dynamic-layout>
</div>

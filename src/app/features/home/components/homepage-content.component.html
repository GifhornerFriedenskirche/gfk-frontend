<!-- Loading indicator -->
<div *ngIf="isLoading" class="py-16 bg-gray-50 animate-pulse">
  <div class="container mx-auto px-4 text-center">
    <div class="w-24 h-24 mx-auto rounded-full bg-gray-300 mb-4"></div>
    <div class="h-6 bg-gray-300 w-1/4 mx-auto mb-2"></div>
    <div class="h-4 bg-gray-300 w-1/3 mx-auto"></div>
  </div>
</div>

<!-- Error indicator -->
<div *ngIf="hasError && !isLoading" class="py-16 bg-gray-50">
  <div class="container mx-auto px-4 text-center">
    <div class="text-error mb-4">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-16 w-16 mx-auto"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-2.034-.833-2.804 0L3.34 16c-.77.833.192 2 1.732 2z"
        />
      </svg>
    </div>
    <h3 class="text-xl font-bold mb-2">Inhalt konnte nicht geladen werden</h3>
    <button class="btn btn-sm btn-primary mt-4" (click)="loadContent()">
      Erneut versuchen
    </button>
  </div>
</div>

<!-- Content section -->
<section
  *ngIf="
    content &&
    content.tiles &&
    content.tiles.length > 0 &&
    !isLoading &&
    !hasError
  "
  class="py-16 bg-gray-50"
>
  <div class="container mx-auto px-4">
    <!-- Content Cards Grid -->
    <div
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-6xl mx-auto"
    >
      <!-- Loop through all tiles in content -->
      <div
        *ngFor="let tile of content.tiles; let i = index"
        class="card shadow-lg hover:shadow-2xl transition-all duration-300 h-full relative overflow-hidden group cursor-pointer transform hover:-translate-y-2"
        style="background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%)"
      >
        <!-- Image -->
        <figure class="relative overflow-hidden h-48">
          <img
            *ngIf="tile.tileImage?.path || tile.image?.path; else noImage"
            [src]="
              baseApiUrl +
              '/storage/uploads' +
              (tile.tileImage?.path || tile.image?.path)
            "
            [alt]="tile.tileImage?.title || tile.image?.title || ''"
            class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
            onerror="this.onerror=null; this.src='assets/images/placeholder.jpg';"
          />
          <ng-template #noImage>
            <div
              class="w-full h-full bg-orange-300 flex items-center justify-center"
            >
              <span class="text-orange-800">Kein Bild verfügbar</span>
            </div>
          </ng-template>
        </figure>

        <!-- Card Body -->
        <div class="card-body p-6 text-white">
          <h3 class="card-title text-2xl font-bold mb-4 text-white">
            {{ tile.tiletitle || tile.title || "" }}
          </h3>

          <p class="text-base leading-relaxed text-white opacity-90">
            {{ tile.tileText || tile.text || tile.description || "" }}
          </p>

          <!-- Action Button -->
          <div class="card-actions justify-end mt-6">
            <button
              *ngIf="tile.tileLink; else noLinkButton"
              (click)="handleTileClick(tile)"
              class="btn bg-white text-orange-500 hover:bg-orange-50 border-white hover:border-orange-100 transition-all duration-300 hover:scale-105"
            >
              Mehr erfahren
            </button>
            <ng-template #noLinkButton>
              <button
                class="btn bg-white text-orange-500 hover:bg-orange-50 border-white hover:border-orange-100 transition-all duration-300 hover:scale-105 opacity-50 cursor-not-allowed"
                disabled
              >
                Mehr erfahren
              </button>
            </ng-template>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

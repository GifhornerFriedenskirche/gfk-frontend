<section *ngIf="hasValidContent()" class="py-16 relative bg-white">
  <!-- Decorative background dots pattern -->
  <div
    class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none"
  >
    <div
      class="absolute"
      [class.left-0]="!isReversed"
      [class.right-0]="isReversed"
      style="top: 0%; width: 35%; height: 80%; opacity: 0.08"
    >
      <div class="w-full h-full bg-dots-pattern"></div>
    </div>
  </div>

  <div class="container mx-auto px-4 relative z-10">
    <div
      class="flex flex-col lg:flex-row items-center gap-8 lg:gap-16 max-w-6xl mx-auto"
      [class.lg:flex-row-reverse]="isReversed"
    >
      <!-- Image Section with background dots pattern -->
      <div class="w-full lg:w-1/2 relative">
        <!-- Dots pattern behind the image -->
        <div class="absolute inset-2 -z-10 bg-dots-pattern opacity-10"></div>
        
        <div class="overflow-hidden relative shadow-lg">
          <img
            [src]="getImage()"
            [alt]="getImageAlt()"
            class="w-full h-auto object-cover min-h-[300px]"
            onerror="this.onerror=null; this.src='assets/images/placeholder.svg';"
          />
        </div>
      </div>

      <!-- Text Section -->
      <div class="w-full lg:w-1/2">
        <div class="relative">
          <h2 class="text-3xl lg:text-4xl font-bold text-gray-800 mb-6">
            {{ getTitle() }}
          </h2>
          <div
            class="prose prose-lg text-gray-600 mb-8"
            [innerHTML]="getText() | safeHtml"
          ></div>

          <!-- Action Button (Optional) -->
          <div *ngIf="hasButton()" class="mt-8">
            <a
              [routerLink]="getButtonLink()"
              class="btn bg-orange-500 hover:bg-orange-600 text-white border-orange-500 hover:border-orange-600 transform hover:scale-105 transition-all duration-300"
            >
              {{ getButtonText() }}
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
